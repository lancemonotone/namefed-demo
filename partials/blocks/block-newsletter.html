<section class="section-content {{modifiers}}">
  <div class="section-content__inner flow">
    <h2>Stay in the Loop</h2>
    <p>Subscribe to our newsletter for rates, specials, and credit union news delivered to your inbox.</p>
    <form class="newsletter-form gform_wrapper" action="#" method="post">
      <div class="gform_body">
        <div class="gform_fields">
          <div class="ginput_column ginput_container">
            <span>
              <label for="newsletter-email" class="gfield_label">Email address</label>
              <input type="email" id="newsletter-email" name="email" placeholder="Enter your email" required>
            </span>
          </div>
        </div>
      </div>
      <div class="gform_footer">
        <button type="submit" class="btn btn-secondary gform_button">Subscribe to Newsletter</button>
      </div>
    </form>
  </div>
</section>
