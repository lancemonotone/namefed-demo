<div class="flow">
<h2>Send a Message</h2>
<form class="contact-form gform_wrapper" action="#" method="post">
  <div class="gform_body">
    <div class="gform_fields">
      <div class="ginput_column ginput_container">
        <span>
          <label for="contact-name" class="gfield_label">Name *</label>
          <input type="text" id="contact-name" name="name" placeholder="Your full name" required>
        </span>
        <span>
          <label for="contact-email" class="gfield_label">Email *</label>
          <input type="email" id="contact-email" name="email" placeholder="Enter your email address" required>
        </span>
        <span>
          <label for="contact-subject" class="gfield_label">Subject</label>
          <input type="text" id="contact-subject" name="subject" placeholder="What's this about?">
        </span>
        <span>
          <label for="contact-message" class="gfield_label">Message *</label>
          <textarea id="contact-message" name="message" rows="5" placeholder="Tell us how we can help..." required></textarea>
        </span>
      </div>
    </div>
  </div>
  <div class="gform_footer">
    <button type="submit" class="btn btn-primary gform_button">Send Message</button>
  </div>
</form>
</div>
