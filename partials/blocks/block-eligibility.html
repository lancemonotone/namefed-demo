<section class="section-content eligibility-flow" id="eligibility-flow">
  <div class="section-content__inner flow">
    <div class="eligibility-checker-wrap flow" id="eligibility-checker-wrap">
      <h2>Apply for Membership</h2>
      <p class="lead">Answer two quick questions to see if you qualify for membership. Documentation may be requested to verify eligibility.</p>
      <form class="eligibility-checker gform_wrapper" action="#" method="get" id="eligibility-check-form">
        <div class="gform_body">
          <div class="gform_fields">
            <fieldset class="gfield">
              <legend class="gfield_label gfield_label_before_complex">Where do you work (or where did you work, if retired)? *</legend>
              <div class="ginput_column ginput_container">
                <span>
                  <label for="eligibility-employer" class="gfield_label">Where do you work (or where did you work, if retired)? *</label>
                  <select id="eligibility-employer" name="eligibility_employer" placeholder="Select your employer" required>
                  <option value="">— Select —</option>
                  <option value="city">City of North Adams</option>
                  <option value="city-yard">North Adams City Yard</option>
                  <option value="schools">North Adams Public Schools</option>
                  <option value="fire">North Adams Fire Department</option>
                  <option value="police">North Adams Police Department</option>
                  <option value="ems">Northern Berkshire EMS</option>
                  <option value="housing">North Adams Housing Authority</option>
                  <option value="retiree">Municipal retiree (former employee)</option>
                  <option value="family">Family of current member</option>
                  <option value="other">Other / Not sure</option>
                </select>
                </span>
              </div>
            </fieldset>
            <fieldset class="gfield">
              <legend class="gfield_label gfield_label_before_complex">Do you live or work in Berkshire County, Massachusetts? *</legend>
              <div class="ginput_column ginput_container">
                <span>
                  <label for="eligibility-area" class="gfield_label">Do you live or work in Berkshire County, Massachusetts? *</label>
                  <select id="eligibility-area" name="eligibility_area" placeholder="Select yes or no" required>
                  <option value="">— Select —</option>
                  <option value="yes">Yes</option>
                  <option value="no">No</option>
                </select>
                </span>
              </div>
            </fieldset>
          </div>
        </div>
        <div class="gform_footer">
          <button type="button" class="btn btn-primary gform_button" id="eligibility-check-btn">Check Eligibility</button>
        </div>
        <div id="eligibility-result" class="eligibility-result" aria-live="polite" hidden></div>
      </form>
    </div>
  </div>

  {{modalHtml}}
</section>
