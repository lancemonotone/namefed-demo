<section class="section-hero">
  <div class="section-hero__bg" role="img" aria-label="{{bgAlt}}" style="background-image: url('{{bgImage}}');"></div>
  <div class="section-hero__inner flow">
    <h1>{{title}}</h1>
    <p class="section-hero__tagline">{{tagline}}</p>
    <div class="section-hero__ctas cluster cluster--lg">
      {{ctasHtml}}
    </div>
  </div>
</section>
