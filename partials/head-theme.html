<meta name="color-scheme" content="light dark">
<script>
(function(){var d=document.documentElement;d.setAttribute('data-theme',window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})();
</script>
<style>
html{background:#fdfbf7}html[data-theme="dark"]{background:#1a1814}
</style>
